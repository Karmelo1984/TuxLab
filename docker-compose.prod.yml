# Producción autoalojada tras un proxy HTTPS (o previsualización en localhost).
# Cambiar SITE_URL al dominio definitivo al construir la imagen.
services:
  tuxlab:
    image: tuxlab-site:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        SITE_URL: ${SITE_URL:-https://karmelo1984.github.io/TuxLab/}
    init: true
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:${TUXLAB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /config:rw,nosuid,nodev,noexec,size=16m,mode=1777
      - /data:rw,nosuid,nodev,noexec,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
