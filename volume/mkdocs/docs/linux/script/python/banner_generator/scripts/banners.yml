# Manifiesto de banners de cabecera de TuxLab.
# Cada entrada genera un SVG de 1600x400 (o el tamaño indicado) con banner_generator.py.
#
# Campos:
#   md            ruta del .md asociado, relativa a docs/ (solo informativa)
#   out           ruta de salida del .svg, relativa a docs/
#   title         texto grande del banner
#   subtitle      texto pequeño en mayúsculas bajo el título
#   icon          un emoji
#   tag           etiqueta de categoría (arriba a la derecha)
#   bg_from/bg_mid/bg_to   degradado de fondo (hex)
#   accent/accent_light    color de insignia/acentos (hex)
#   motif         dots | grid | circuit | scan | raspi | none
#   width/height  opcionales, por defecto 1600x400

banners:
- md: self-hosting/duplicati/duplicati.md
  out: self-hosting/duplicati/img/img-duplicati-header-02.svg
