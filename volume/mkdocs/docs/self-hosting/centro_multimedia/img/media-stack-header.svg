<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e2a5e"/>
      <stop offset="100%" stop-color="#3b2f72"/>
    </linearGradient>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="mon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <circle cx="1480" cy="70" r="170" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="360" r="120" fill="#ffffff" opacity="0.03"/>

  <rect x="1400" y="28" width="172" height="34" rx="17" fill="#000000" opacity="0.25" stroke="#c7d2fe" stroke-width="1"/>
  <text x="1486" y="51" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="600" letter-spacing="2">SELF-HOSTING</text>

  <text x="800" y="64" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Media Stack + Monitoring + Portainer</text>
  <text x="800" y="92" text-anchor="middle" fill="#9fb4ff" font-size="16" letter-spacing="2">PLATAFORMA AUTOHOSPEDADA · DOCKER SWARM</text>

  <!-- Columna Descarga y organización -->
  <g filter="url(#soft)">
    <rect x="70" y="130" width="440" height="220" rx="18" fill="#101935" opacity="0.6" stroke="#2f3f7a" stroke-width="1"/>
  </g>
  <text x="290" y="162" text-anchor="middle" fill="#bcd0ff" font-size="16" font-weight="600">DESCARGA Y ORGANIZACIÓN</text>

  <g>
    <rect x="95" y="182" width="190" height="42" rx="11" fill="url(#dl)"/>
    <text x="190" y="209" text-anchor="middle" fill="#fff" font-size="16">🎞️ Transmission</text>

    <rect x="295" y="182" width="190" height="42" rx="11" fill="url(#dl)"/>
    <text x="390" y="209" text-anchor="middle" fill="#fff" font-size="16">🔍 Prowlarr</text>

    <rect x="95" y="234" width="190" height="42" rx="11" fill="url(#dl)"/>
    <text x="190" y="261" text-anchor="middle" fill="#fff" font-size="16">🎬 Radarr</text>

    <rect x="295" y="234" width="190" height="42" rx="11" fill="url(#dl)"/>
    <text x="390" y="261" text-anchor="middle" fill="#fff" font-size="16">📺 Sonarr</text>

    <rect x="195" y="286" width="190" height="42" rx="11" fill="url(#dl)"/>
    <text x="290" y="313" text-anchor="middle" fill="#fff" font-size="16">🈂️ Bazarr</text>
  </g>

  <!-- Columna Visualización -->
  <g filter="url(#soft)">
    <rect x="560" y="130" width="440" height="220" rx="18" fill="#101935" opacity="0.6" stroke="#4a2f7a" stroke-width="1"/>
  </g>
  <text x="780" y="162" text-anchor="middle" fill="#dcc2ff" font-size="16" font-weight="600">VISUALIZACIÓN</text>

  <g>
    <rect x="600" y="192" width="360" height="54" rx="13" fill="url(#play)"/>
    <text x="780" y="226" text-anchor="middle" fill="#fff" font-size="18">🎥 Jellyfin — streaming local</text>

    <rect x="600" y="262" width="360" height="54" rx="13" fill="url(#play)"/>
    <text x="780" y="296" text-anchor="middle" fill="#fff" font-size="18">🧩 Homarr — dashboard</text>
  </g>

  <!-- Columna Monitorización y gestión -->
  <g filter="url(#soft)">
    <rect x="1050" y="130" width="480" height="220" rx="18" fill="#101935" opacity="0.6" stroke="#7a4a2f" stroke-width="1"/>
  </g>
  <text x="1290" y="162" text-anchor="middle" fill="#ffd9b8" font-size="16" font-weight="600">MONITORIZACIÓN Y GESTIÓN</text>

  <g>
    <rect x="1075" y="182" width="200" height="42" rx="11" fill="url(#mon)"/>
    <text x="1175" y="209" text-anchor="middle" fill="#fff" font-size="16">📊 Grafana</text>

    <rect x="1285" y="182" width="220" height="42" rx="11" fill="url(#mon)"/>
    <text x="1395" y="209" text-anchor="middle" fill="#fff" font-size="16">📈 Prometheus</text>

    <rect x="1075" y="234" width="200" height="42" rx="11" fill="url(#mon)"/>
    <text x="1175" y="261" text-anchor="middle" fill="#fff" font-size="16">🖥 Node Exporter</text>

    <rect x="1285" y="234" width="220" height="42" rx="11" fill="url(#mon)"/>
    <text x="1395" y="261" text-anchor="middle" fill="#fff" font-size="16">📦 cAdvisor</text>

    <rect x="1180" y="286" width="200" height="42" rx="11" fill="url(#mon)"/>
    <text x="1280" y="313" text-anchor="middle" fill="#fff" font-size="16">⚙️ Portainer</text>
  </g>

  <rect x="0" y="394" width="1600" height="6" fill="#7e22ce"/>
</svg>
