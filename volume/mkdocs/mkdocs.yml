---
# -----------------------------------------------------------------------------
# 🧭 Identidad del sitio
# -----------------------------------------------------------------------------
site_name: TuxLab
site_description: "Documentación técnica personal sobre Self-Hosting, Docker, Linux y Raspberry Pi"
site_author: Carmelo Molero Castillo
repo_url: https://github.com/Karmelo1984/info-linux
repo_name: TuxLab en GitHub
# site_url: "https://example.com"   # Rellenar si se publica (p.ej. GitHub Pages)

docs_dir: docs
site_dir: site

markdown_extensions:
  # --- Extensiones nativas de MkDocs ---
  - admonition                     # Bloques tipo "Nota", "Advertencia", etc.
  - codehilite                     # Resaltado de código (Pygments)
  - footnotes                      # Permite referencias al pie en markdown
  - meta                           # Lee metadatos YAML de cada archivo .md
  - toc:
      permalink: true              # Añade un icono de enlace en cada título
      title: "Contenido"           # Título del índice lateral

  # --- Extensiones de PymdownX (avanzadas) ---
  - markdown.extensions.extra  # Soporte para tablas y listas anidadas
  - markdown.extensions.nl2br  # Convierte saltos de línea en <br>
  - pymdownx.extra             # Extensiones avanzadas de Markdown
  - pymdownx.tabbed:
      alternate_style: true    # Pestañas con estilo Material
  - pymdownx.superfences:      # Mejora bloques de código
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem          # Corrige problemas con negritas y cursivas
  - pymdownx.emoji             # Soporte para emojis
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details           # Admonitions colapsables

# -----------------------------------------------------------------------------
# 🎨 Tema visual y UX
# -----------------------------------------------------------------------------
theme:
  name: material
  language: es

  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Modo oscuro

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

  # Branding opcional
  # logo: img/logo.png
  # favicon: img/favicon.png

# -----------------------------------------------------------------------------
# 📦 Plugins
# -----------------------------------------------------------------------------
plugins:
  - search
  - awesome-pages:
      collapse_single_pages: true
  - mermaid2
  #- git-revision-date-localized:
  #    type: date

# -----------------------------------------------------------------------------
# 🌐 Extras
# -----------------------------------------------------------------------------
extra:
  generator: false

# -----------------------------------------------------------------------------
# 💅 Estilos personales
# -----------------------------------------------------------------------------
extra_css:
  - overrides/extra.css

# ============================================
# Navegación: gestionada mediante archivos `.pages`
# (plugin mkdocs-awesome-pages-plugin) junto a cada sección en docs/
# ============================================
