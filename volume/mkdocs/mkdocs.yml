---
site_name: TuxLab
site_author: Carmelo Molero Castillo

markdown_extensions:
  # --- Extensiones nativas de MkDocs ---
  - admonition                     # Bloques tipo "Nota", "Advertencia", etc.
  - codehilite                     # Resaltado de código (Pygments)
  - footnotes                      # Permite referencias al pie en markdown
  - meta                           # Lee metadatos YAML de cada archivo .md
  - toc:
      permalink: true              # Añade un icono de enlace en cada título
      title: "Contenido"           # Título del índice lateral

  # --- Extensiones de PymdownX (avanzadas) ---
  - markdown.extensions.extra  # Soporte para tablas y listas anidadas
  - markdown.extensions.nl2br  # Convierte saltos de línea en <br>
  - pymdownx.extra             # Extensiones avanzadas de Markdown
  - pymdownx.tabbed            # Pestañas dentro del contenido
  - pymdownx.superfences:      # Mejora bloques de código
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem          # Corrige problemas con negritas y cursivas
  - pymdownx.emoji             # Soporte para emojis
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Tema y configuración
theme:
  name: "mkdocs"
  language: "es"
  color_mode: "dark"
  include_sidebar: false
  user_color_mode_toggle: true
  prev_next_buttons_location: "bottom"
  features:
    - content.code.copy
    - content.code.select

