
name: Publicar TuxLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs pymdown-extensions

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Generar documentación
        run: |
          mkdocs build \
            --config-file volume/mkdocs/mkdocs.yml \
            --site-dir "$GITHUB_WORKSPACE/site"

      - name: Subir documentación
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
