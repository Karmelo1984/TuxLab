services:

  # ================== MKDocs
  mkdocs:
    container_name: mkdocs
    image: polinux/mkdocs
    restart: unless-stopped

    environment:
      LIVE_RELOAD_SUPPORT: 'true'
      ADD_MODULES: 'fontawesome-markdown mkdocs-git-revision-date-localized-plugin mkdocs-material mkdocs-mermaid2-plugin mkdocs-awesome-pages-plugin'
      FAST_MODE: 'true'
      DOCS_DIRECTORY: '/mkdocs'

    ports:
      - "8000:8000"

    volumes:
      - ./volume/mkdocs:/mkdocs
