# Uso local: docker compose up --build -d
services:
  mkdocs:
    image: tuxlab-mkdocs:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./mkdocs
        target: /mkdocs
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
