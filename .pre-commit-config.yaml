default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # Acepta !!python/name en YAML general.
        # MkDocs utiliza además el tag !ENV, que PyYAML no reconoce fuera de MkDocs.
        # Su validez se comprueba ejecutando mkdocs build en lint.yml.
        exclude: ^mkdocs/mkdocs\.yml$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: (\.ya?ml|(^|/)\.pages)$
        types_or: [yaml, file]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-frontmatter
        name: Validar cabecera YAML (title y description)
        entry: python3 scripts/check_frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^mkdocs/docs/.*\.md$
      - id: mkdocs-build
        name: mkdocs build (igual que Pages)
        entry: mkdocs build --clean --config-file mkdocs/mkdocs.yml --site-dir /tmp/tuxlab-site
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
