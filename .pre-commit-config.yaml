repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # Acepta !!python/name en YAML general.
        # MkDocs utiliza además el tag !ENV, que PyYAML no reconoce fuera de MkDocs.
        # Su validez se comprueba ejecutando mkdocs build en lint.yml.
        exclude: ^mkdocs/mkdocs\.yml$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: (\.ya?ml|(^|/)\.pages)$
        types_or: [yaml, file]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
