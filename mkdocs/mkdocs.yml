---
# -----------------------------------------------------------------------------
# Identidad del sitio
# -----------------------------------------------------------------------------
site_name: TuxLab
site_description: "Documentación técnica personal sobre Self-Hosting, Docker, Linux y Raspberry Pi"
site_author: Carmelo Molero Castillo
site_url: https://karmelo1984.github.io/TuxLab/
repo_url: https://github.com/Karmelo1984/TuxLab
repo_name: Karmelo1984/TuxLab

docs_dir: docs
site_dir: site

markdown_extensions:
  # --- Extensiones nativas de MkDocs ---
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
      title: "Contenido"
  # Necesaria para asignar clases a iconos y emojis.
  - attr_list

  # --- Extensiones avanzadas de Markdown ---
  - markdown.extensions.extra
  - markdown.extensions.nl2br
  - pymdownx.extra
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem
  # Iconos Material/Font Awesome nativos: sin fontawesome-markdown.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details

# -----------------------------------------------------------------------------
# Tema visual y UX (sin modificar su aspecto anterior)
# -----------------------------------------------------------------------------
theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Modo oscuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - search
  - awesome-pages:
      collapse_single_pages: true
  - mermaid2
  # Activo en CI (GitHub Actions y etapa Docker de producción), inactivo local.
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      type: date
      enable_creation_date: true
      fallback_to_build_date: false

extra:
  generator: false

extra_css:
  - overrides/extra.css

# Navegación controlada por los archivos .pages dentro de docs/.
